plugins {
    id 'java-library'
    id 'polaris.repositories'
    id 'maven-publish'
    id 'idea'
}

version = project.property("mod_version")
group = project.property("mod_group_id")

base {
    archivesName = project.findProperty('mod_archive_name') ?: project.property('mod_id')
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)
java.withSourcesJar()

pluginManager.withPlugin('net.neoforged.moddev') {
    neoForge {
        version = project.property('neo_version')
        parchment {
            minecraftVersion = project.property('minecraft_version')
            mappingsVersion = project.property('parchment_version')
        }
        runs.configureEach {
            if (name == 'server') {
                // Keep the dedicated Swing console, but avoid a second GPU
                // pipeline alongside the game (including virtual displays).
                // These flags affect Java2D only, never Minecraft OpenGL.
                systemProperty 'sun.java2d.d3d', 'false'
                systemProperty 'sun.java2d.noddraw', 'true'
                systemProperty 'sun.java2d.opengl', 'false'
            }
        }
    }
}

// Keep the distributable self-describing without colliding with licenses from
// embedded or transformed dependencies.
def moduleId = project.property('mod_id')
tasks.named('jar', Jar) {
    from(rootProject.file('LICENSE')) {
        rename 'LICENSE', "LICENSE_${moduleId}"
    }
}

// Expand metadata for the main mod and add-on from their module properties.
def replaceProperties = ['minecraft_version', 'minecraft_version_range', 'neo_version',
        'neo_version_range', 'loader_version_range', 'mod_id', 'mod_name', 'mod_license',
        'mod_version', 'mod_authors', 'mod_description', 'geckolib_version'].collectEntries {
    [(it): project.property(it)]
}

tasks.named('processResources', ProcessResources) {
    inputs.properties replaceProperties
    filesMatching('META-INF/neoforge.mods.toml') {
        expand replaceProperties
    }
}

def generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into layout.buildDirectory.dir('generated/sources/modMetadata')
}

sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

// Source navigation in the IDE applies to every mod module.
idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}

