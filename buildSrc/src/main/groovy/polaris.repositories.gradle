repositories {
    mavenLocal {
        // OELib must use the published remote artifact, not thin local development jars.
        content { excludeGroupByRegex('cc\\.sighs\\.oelib(\\..*)?') }
    }
    mavenCentral()
    maven {
        url "https://maven.sighs.cc/repository/maven-releases/"
        content {
            includeGroupByRegex('cc\\.sighs(\\..*)?')
            includeGroup('com.flechazo')
        }
        mavenContent { releasesOnly() }
    }
    maven {
        url "https://maven.sighs.cc/repository/maven-snapshots/"
        content {
            includeGroupByRegex('cc\\.sighs(\\..*)?')
            includeGroup('com.flechazo')
        }
        mavenContent { snapshotsOnly() }
    }
    maven {
        name = "Curse Maven"
        url = uri("https://www.cursemaven.com")
        content {
            includeGroup("curse.maven")
        }
    }
    maven {
        name = 'GeckoLib'
        url 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
        content {
            includeGroup("software.bernie.geckolib")
        }
    }
    ivy {
        name = 'Local Spark Core'
        url = rootProject.layout.projectDirectory.dir('libs')
        patternLayout {
            artifact '[artifact]-[revision].[ext]'
        }
        metadataSources {
            artifact()
        }
    }
}
